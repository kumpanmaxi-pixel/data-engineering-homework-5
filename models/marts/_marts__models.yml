version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу присоединены итоги по платежам.
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: ordered_at
        description: "Время оформления заказа."

      - name: order_status
        description: "Статус заказа."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']

      - name: order_amount
        description: "Сумма заказа после скидок."
        data_tests: [non_negative]

      - name: paid_amount
        description: "Сумма успешных оплат без возвратов."
        data_tests: [non_negative]

      - name: refunded_amount
        description: "Сумма возвратов."

      - name: net_paid_amount
        description: "Оплачено минус возвращено."

      - name: successful_payments_count
        description: "Количество успешных платежных операций."

      - name: first_paid_at
        description: "Время первой успешной оплаты."

      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

      - name: items_count
        description: "Количество различных товаров в заказе."

  - name: fct_order_items
    description: "Факт товарных позиций. Одна строка — один товар в заказе."
    columns:
      - name: order_item_id
        description: "Уникальный идентификатор позиции."
        data_tests: [unique, not_null]

      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id

      - name: product_id
        description: "Идентификатор товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Идентификатор клиента."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: "Дата заказа."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day

      - name: quantity
        description: "Количество единиц товара."
        data_tests: [non_negative]

      - name: unit_price
        description: "Цена единицы товара."

      - name: discount_amount
        description: "Сумма скидки."

      - name: gross_amount
        description: "Стоимость до скидки."

      - name: line_amount
        description: "Стоимость позиции после скидки."

      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'

  - name: dim_customers
    description: "Измерение клиентов, включая клиентов без покупок."
    columns:
      - name: customer_id
        description: "Уникальный идентификатор клиента."
        data_tests: [unique, not_null]

      - name: registered_at
        description: "Время регистрации клиента."

      - name: registration_date
        description: "Дата регистрации клиента."

      - name: city
        description: "Город клиента."

      - name: acquisition_channel
        description: "Канал привлечения клиента."

      - name: first_confirmed_order_id
        description: "Номер первой подтвержденной покупки."
      - name: first_confirmed_at
        description: "Время первой подтвержденной покупки."
      - name: confirmed_orders_count
        description: "Количество подтвержденных покупок."
      - name: confirmed_revenue
        description: "Сумма подтвержденных покупок."
      - name: is_buyer
        description: "Признак наличия подтвержденных покупок."
  - name: dim_products
    description: "Измерение товаров с брендами и иерархией категорий."
    columns:
      - name: product_id
        description: "Уникальный идентификатор товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара."
      - name: parent_category_name
        description: "Родительская категория."
      - name: root_category_name
        description: "Корневая категория."
  - name: dim_dates
    description: "Календарное измерение для анализа заказов по датам."
    columns:
      - name: date_day
        description: "Календарная дата."
        data_tests: [unique, not_null]

      - name: year
        description: "Год."

      - name: quarter
        description: "Квартал."

      - name: month
        description: "Месяц."

      - name: day
        description: "День месяца."

      - name: day_of_week
        description: "Номер дня недели."

      - name: is_weekend
        description: "Признак выходного дня."